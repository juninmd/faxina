[package]
name = "faxina"
version = "0.1.0"
description = "Visual disk cleaner: caches, duplicates and space map"
authors = ["juninmd"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "faxina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.0"
rayon = "1.12.0"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
trash = "5.2.9"
dirs = "7.0.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3.27.0"
